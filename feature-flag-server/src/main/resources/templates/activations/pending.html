<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Activations - Feature Flag Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
    <div class="page-header">
        <h1>Pending Activations</h1>
    </div>

    <div class="card">
        <table th:if="${!activations.isEmpty()}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Flag</th>
                <th>Environment</th>
                <th>New State</th>
                <th>Status</th>
                <th>ACK Progress</th>
                <th>Timeout</th>
                <th>Created</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="act : ${activations}">
                <td style="font-family: monospace; font-size: 0.8rem;">
                    <a th:href="@{/dashboard/activations/{id}(id=${act.id()})}"
                       th:text="${#strings.abbreviate(act.id(), 12)}" style="color: #1a73e8;"></a>
                </td>
                <td th:text="${act.flagId()}" style="font-family: monospace; font-size: 0.8rem;"></td>
                <td th:text="${act.environment()}" style="font-weight: 500;"></td>
                <td>
                    <span class="badge"
                          th:classappend="${act.newEnabled()} ? 'badge-on' : 'badge-off'"
                          th:text="${act.newEnabled()} ? 'ON' : 'OFF'"></span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="'badge-' + ${#strings.toLowerCase(act.status())}"
                          th:text="${act.status()}"></span>
                </td>
                <td>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <div class="progress" style="flex: 1; min-width: 80px;">
                            <div class="progress-bar"
                                 th:style="'width:' + ${act.totalInstances() > 0 ? (act.ackedInstances() * 100 / act.totalInstances()) : 0} + '%'"></div>
                        </div>
                        <span style="font-size: 0.8rem;" th:text="${act.ackedInstances()} + '/' + ${act.totalInstances()}"></span>
                    </div>
                </td>
                <td th:text="${act.timeoutSeconds()} + 's'"></td>
                <td class="timestamp" th:text="${@fmt.instant(act.createdAt())}"></td>
                <td>
                    <a th:href="@{/dashboard/activations/{id}(id=${act.id()})}" class="btn btn-secondary btn-sm">Details</a>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${activations.isEmpty()}" class="empty-state">
            <p>No pending activations.</p>
        </div>
    </div>
</div>

<script>
    // Auto-refresh pending activations every 5 seconds
    setTimeout(function() { location.reload(); }, 5000);
</script>
</body>
</html>
