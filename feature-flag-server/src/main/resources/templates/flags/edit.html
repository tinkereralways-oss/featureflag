<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Flag - Feature Flag Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
    <div class="page-header">
        <h1>
            <a th:href="@{/dashboard/flags/{key}(key=${flag.flagKey()})}" style="color: #888; text-decoration: none;">&larr;</a>
            Edit Flag
        </h1>
    </div>

    <div th:replace="~{fragments/flash :: messages}"></div>

    <div class="card">
        <form th:action="@{/dashboard/flags/{key}/edit(key=${flag.flagKey()})}" method="post">
            <div class="form-group">
                <label for="flagKey">Flag Key</label>
                <input type="text" id="flagKey" th:value="${flag.flagKey()}" readonly disabled
                       style="background: #f5f5f5; color: #888;">
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" th:value="${flag.name()}"
                       placeholder="Flag name">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" th:text="${flag.description()}"
                          placeholder="Describe the purpose of this flag..."></textarea>
            </div>

            <div class="form-group">
                <label for="owner">Owner</label>
                <input type="text" id="owner" name="owner" th:value="${flag.owner()}"
                       placeholder="team-name or user@example.com">
            </div>

            <div class="form-group">
                <label for="staleAfterDays">Stale After (days)</label>
                <input type="number" id="staleAfterDays" name="staleAfterDays"
                       th:value="${flag.staleAfterDays()}" min="1" style="width: 150px;">
            </div>

            <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/dashboard/flags/{key}(key=${flag.flagKey()})}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
