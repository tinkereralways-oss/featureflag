databaseChangeLog:
  - changeSet:
      id: 002-create-feature-flags
      author: dev-1
      changes:
        - createTable:
            tableName: feature_flags
            columns:
              - column:
                  name: id
                  type: VARCHAR2(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: flag_key
                  type: VARCHAR2(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR2(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR2(4000)
              - column:
                  name: owner
                  type: VARCHAR2(255)
              - column:
                  name: lifecycle_state
                  type: VARCHAR2(20)
                  defaultValue: CREATED
                  constraints:
                    nullable: false
              - column:
                  name: stale_after_days
                  type: NUMBER
                  defaultValueNumeric: 90
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: SYSTIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: SYSTIMESTAMP
      rollback:
        - dropTable:
            tableName: feature_flags
