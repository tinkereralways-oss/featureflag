databaseChangeLog:
  - changeSet:
      id: 007-create-pending-activations
      author: dev-1
      changes:
        - createTable:
            tableName: pending_activations
            columns:
              - column:
                  name: id
                  type: VARCHAR2(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: flag_id
                  type: VARCHAR2(36)
                  constraints:
                    nullable: false
              - column:
                  name: environment
                  type: VARCHAR2(50)
                  constraints:
                    nullable: false
              - column:
                  name: new_enabled
                  type: NUMBER(1)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR2(20)
                  defaultValue: PENDING
              - column:
                  name: total_instances
                  type: NUMBER
              - column:
                  name: acked_instances
                  type: NUMBER
                  defaultValueNumeric: 0
              - column:
                  name: timeout_seconds
                  type: NUMBER
                  defaultValueNumeric: 60
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: SYSTIMESTAMP
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: pending_activations
            baseColumnNames: flag_id
            referencedTableName: feature_flags
            referencedColumnNames: id
            constraintName: fk_pending_act_flag_id
      rollback:
        - dropTable:
            tableName: pending_activations
