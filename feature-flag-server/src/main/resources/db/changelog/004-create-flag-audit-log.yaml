databaseChangeLog:
  - changeSet:
      id: 004-create-flag-audit-log
      author: dev-1
      changes:
        - createTable:
            tableName: flag_audit_log
            columns:
              - column:
                  name: id
                  type: NUMBER
                  defaultValueSequenceNext: audit_log_seq
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: flag_id
                  type: VARCHAR2(36)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR2(50)
                  constraints:
                    nullable: false
              - column:
                  name: old_value
                  type: VARCHAR2(4000)
              - column:
                  name: new_value
                  type: VARCHAR2(4000)
              - column:
                  name: changed_by
                  type: VARCHAR2(255)
              - column:
                  name: metadata
                  type: CLOB
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: SYSTIMESTAMP
      rollback:
        - dropTable:
            tableName: flag_audit_log
